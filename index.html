<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>메모 - 새 주소로 이동</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;margin:0;padding:40px 24px;text-align:center;background:#f4f5f7;color:#1d1f23}
a,button{display:block;margin:14px auto;max-width:320px;padding:14px;border-radius:12px;font-size:16px;text-decoration:none;border:0}
.p{background:#1f6feb;color:#fff}.s{background:#e5e7eb;color:#1d1f23}
</style>
</head>
<body>
<h2>메모앱이 NAS 저장 버전으로 옮겨졌습니다</h2>
<p id="msg">잠시 후 새 주소로 이동합니다.</p>
<div id="btns"></div>
<script>
var NEW = 'https://pkc-nas2-2.taile40584.ts.net/memo/';
var old = []; try { old = JSON.parse(localStorage.getItem('memo-app-v1')) || []; } catch (e) {}
old = old.filter(function (m) { return (m.title || '').trim() || (m.body || '').trim(); });
if (!old.length) { location.replace(NEW); }
else {
  var json = JSON.stringify(old), bytes = new TextEncoder().encode(json), bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  var b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  document.getElementById('msg').textContent = '이 폰에 예전 메모 ' + old.length + '개가 있습니다. 새 앱(NAS)으로 옮기세요.';
  document.getElementById('btns').innerHTML = '<a class="p" href="' + NEW + '#import=' + b64 + '">예전 메모 옮기고 새 앱 열기</a><a class="s" href="' + NEW + '">옮기지 않고 새 앱 열기</a>';
}
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); });
</script>
</body>
</html>
